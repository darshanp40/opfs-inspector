<!doctype html>
<meta charset="utf-8">
<title>Site with files</title>
<script>
  // Stands in for an app: it stores a file in OPFS and one in a bucket.
  window.ready = (async () => {
    const root = await navigator.storage.getDirectory();
    const file = await root.getFileHandle('notes.txt', { create: true });
    const writable = await file.createWritable();
    await writable.write('from the site');
    await writable.close();
    if (navigator.storageBuckets) {
      const dir = await (await navigator.storageBuckets.open('app-db')).getDirectory();
      await dir.getFileHandle('main.db', { create: true });
    }
    return 'ready';
  })();
</script>
