<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OPFS Inspector</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="toolbar">
    <div class="tools">
      <button id="refresh" class="icon-button" aria-label="Refresh" data-tip="Refresh">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9 M13.5 2v3h-3"/></svg>
      </button>
      <span class="sep"></span>
      <button id="new-file" class="icon-button" aria-label="New file" data-tip="New file">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5h5.5L13 5v9.5H4z M9.5 1.5V5H13 M8.5 7.5v5 M6 10h5"/></svg>
      </button>
      <button id="new-folder" class="icon-button" aria-label="New folder" data-tip="New folder">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5h4.5l1.5 1.5h7v8.5h-13z M8 7v4.5 M5.75 9.25h4.5"/></svg>
      </button>
      <button id="upload" class="icon-button" aria-label="Upload" data-tip="Upload files">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10.5v-8 M4.5 6 8 2.5 11.5 6 M2.5 10.5v3h11v-3"/></svg>
      </button>
      <input id="upload-input" type="file" multiple hidden>
      <span class="sep"></span>
      <button id="rename" class="icon-button" aria-label="Rename" data-tip="Rename">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 2.5l3 3-8 8h-3v-3z M9 4l3 3"/></svg>
      </button>
      <button id="move" class="icon-button" aria-label="Move to" data-tip="Move to">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5h4.5l1.5 1.5h7v8.5h-13z M5 9.25h6 M9 7.25l2 2-2 2"/></svg>
      </button>
      <button id="download" class="icon-button" aria-label="Download" data-tip="Download">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8 M4.5 7 8 10.5 11.5 7 M2.5 10.5v3h11v-3"/></svg>
      </button>
      <button id="delete" class="icon-button danger" aria-label="Delete" data-tip="Delete">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11 M6 4V2.5h4V4 M4 4l.75 9.5h6.5L12 4 M6.75 6.5v4.5 M9.25 6.5v4.5"/></svg>
      </button>
    </div>
    <nav id="crumbs" class="crumbs" aria-label="Path"></nav>
    <label class="pill">
      <span class="visually-hidden">Storage</span>
      <select id="area"></select>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5"/></svg>
    </label>
  </header>
  <div id="status" class="status" role="status"></div>
  <main class="layout">
    <div id="tree" class="tree" role="tree" aria-label="Files" aria-multiselectable="true"></div>
    <section id="card" class="card" aria-label="Selected item">
      <div id="card-head" class="card-head"></div>
      <div id="card-tabs" class="tabs" role="tablist" aria-label="Views" hidden></div>
      <div id="card-body" class="card-body"></div>
    </section>
  </main>
  <footer id="footer" class="footer">
    <span id="origin" class="origin"></span>
    <span id="usage" class="usage"></span>
    <meter id="usage-meter" min="0" max="1" value="0" aria-label="Storage used"></meter>
  </footer>
  <dialog id="help" aria-labelledby="help-title">
    <h2 id="help-title">Keyboard shortcuts</h2>
    <div class="help-scroll" role="region" aria-label="Shortcut list" tabindex="0">
      <table>
        <thead><tr><th scope="col">Command</th><th scope="col">Keys</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <form method="dialog"><button class="primary">Close</button></form>
  </dialog>
  <script type="module" src="build/panel.js"></script>
</body>
</html>
